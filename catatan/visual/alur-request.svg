<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Alur satu request API</title><desc id="desc">Request berjalan dari client ke router, handler, dan PostgreSQL, lalu response kembali ke client.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="350" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">PETA PERJALANAN REQUEST</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Dari client sampai data tersimpan</text>
<g font-family="sans-serif"><rect x="80" y="130" width="190" height="116" rx="16" fill="#202c3f"/><text x="175" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#f3f6fc">Client</text><text x="175" y="211" text-anchor="middle" font-size="14" fill="#b2bfd2">kirim HTTP</text><rect x="350" y="130" width="190" height="116" rx="16" fill="#304875"/><text x="445" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#f3f6fc">Router + handler</text><text x="445" y="211" text-anchor="middle" font-size="14" fill="#dce5fa">validasi + aturan</text><rect x="620" y="130" width="190" height="116" rx="16" fill="#173d3a"/><text x="715" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#77d7c6">SQLx</text><text x="715" y="211" text-anchor="middle" font-size="14" fill="#afd0c8">baca / simpan</text><rect x="890" y="130" width="160" height="116" rx="16" fill="#3a2a1b"/><text x="970" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#ffc37d">PostgreSQL</text><text x="970" y="211" text-anchor="middle" font-size="14" fill="#dfbd96">data API</text><path d="M275 188h65m205 0h65m205 0h65" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/><path d="M970 258v38H175v-39" fill="none" stroke="#55c9b4" stroke-width="3" marker-end="url(#a)"/><text x="572" y="324" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="700" fill="#77d7c6">JSON response + status HTTP kembali ke client</text></g></svg>
